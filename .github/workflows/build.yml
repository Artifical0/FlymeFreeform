name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          # 17 for the Kotlin/Java toolchain, 25 for the Gradle daemon (gradle-daemon-jvm.properties).
          java-version: |
            17
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: false

      - name: Unit tests and release build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Sign APK
        id: sign
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A stable key is required: Android refuses to update an app whose signature changed.
          for v in SIGNING_KEY_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "Missing secret $v"; exit 1; }
          done
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          [ -n "$UNSIGNED" ] || { ls -R app/build/outputs/apk; exit 1; }
          VERSION=$(grep '^flymeFreeformVersionName=' gradle.properties | cut -d= -f2)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p dist
          echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:SIGNING_STORE_PASSWORD --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "dist/FlymeFreeform-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs "dist/FlymeFreeform-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=dist/FlymeFreeform-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: FlymeFreeform-${{ steps.sign.outputs.version }}
          path: ${{ steps.sign.outputs.apk }}

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sign.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${{ steps.sign.outputs.apk }}"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "FlymeFreeform $VERSION" \
              --notes "Built from \`$GITHUB_SHA\`. Signed with this fork's own key: uninstall builds from other sources first." \
              "${{ steps.sign.outputs.apk }}"
          fi
